name: Build Android APK

# Builds an installable APK on every push to main and publishes it to the
# "apk-latest" release, so this link always serves the newest build:
# https://github.com/SgodoNkuna/hot-seat/releases/download/apk-latest/hot-seat.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # generate the native Android project from app.json
      - run: npx expo prebuild --platform android --no-install

      # release build signed with the template's debug key: fine for sharing/sideloading, not for the Play Store
      - name: Gradle assembleRelease
        working-directory: android
        # ARM only: every real Android phone; x86 builds are only for emulators and nearly double the size
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - run: cp android/app/build/outputs/apk/release/app-release.apk hot-seat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hot-seat-apk
          path: hot-seat.apk

      # launch check: an x86_64 build of the same code on an emulator must open and stay open
      - name: Build x86_64 copy for the emulator
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 && cp app/build/outputs/apk/release/app-release.apk ../hot-seat-x86.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/android-smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: smoke/

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest Android build of Hot Seat (BETA) from commit ${GITHUB_SHA::7}.
          Install: open this link on an Android phone, download hot-seat.apk, and allow installing from this source when asked."
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --notes "$NOTES"
          else
            gh release create apk-latest --title "Hot Seat Android (latest)" --notes "$NOTES" --prerelease --target main
          fi
          gh release upload apk-latest hot-seat.apk --clobber
