name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web
        env:
          # online game server address, set in repo Settings → Variables → SERVER_URL
          EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}

      # GitHub Pages project sites serve from /<repo>/, but Expo's web export
      # hardcodes root-absolute paths ("/_expo/...", "/manifest.json"). Prefix them
      # with /hot-seat so they resolve from nested screen URLs like /hot-seat/setup.
      - name: Prefix asset paths with the Pages sub-path
        run: |
          sed -i 's#"/_expo/#"/hot-seat/_expo/#g; s#href="/#href="/hot-seat/#g' dist/index.html
          find dist/_expo -name '*.js' -exec sed -i 's#"/assets/#"/hot-seat/assets/#g' {} +

      # Pages has no SPA fallback: serve the app for any unknown path so a refreshed
      # or shared screen URL (e.g. a QR join link) still loads.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
